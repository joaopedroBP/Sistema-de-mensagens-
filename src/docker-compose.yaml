services:
  broker:
    build: ./broker
    container_name: broker
    ports:
      - "5555:5555"
      - "5556:5556"
    networks:
      - msg_network

  servidor:
    build: ./servidor
    container_name: servidor
    depends_on:
      - broker
    networks:
      - msg_network

  cliente:
    build: ./cliente
    container_name: cliente
    depends_on:
      - servidor
    networks:
      - msg_network

networks:
  msg_network:
